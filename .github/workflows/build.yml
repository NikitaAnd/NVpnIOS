name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle 8.4
        run: |
          set -e
          GRADLE_VERSION=8.4
          if [ ! -d "/opt/gradle/gradle-${GRADLE_VERSION}" ]; then
            sudo mkdir -p /opt/gradle
            cd /tmp
            wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O gradle.zip
            sudo unzip -q gradle.zip -d /opt/gradle
            rm gradle.zip
          fi
          echo "GRADLE_HOME=/opt/gradle/gradle-${GRADLE_VERSION}" >> $GITHUB_ENV
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH
          which gradle
          gradle --version 2>&1 | head -5

      - name: Cache Gradle and AGP
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('dembel/build.gradle', 'dembel/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Build APK
        id: build
        run: |
          # Запускаем gradle, сохраняем лог, печатаем хвост, пробрасываем exit code
          set +e
          gradle --no-daemon --stacktrace assembleDebug > build.log 2>&1
          GRADLE_EXIT=$?
          echo "=== gradle exit code: $GRADLE_EXIT ==="
          echo "=== last 200 lines of build.log ==="
          tail -200 build.log
          echo "=== Find APK files ==="
          find . -name "*.apk" -not -path "*/.gradle/*" 2>/dev/null
          echo "=== outputs dir ==="
          ls -la app/build/outputs/ 2>/dev/null || echo "no outputs dir"
          echo "=== full build dir tree (depth 4) ==="
          find app/build -maxdepth 4 -type d 2>/dev/null || echo "no build dir"
          exit $GRADLE_EXIT
        working-directory: dembel

      - name: Save build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: dembel/build.log
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: dembel/build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dembel-apk
          path: dembel/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
