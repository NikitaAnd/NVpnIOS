name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle and AGP
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('dembel/gradle/wrapper/gradle-wrapper.properties', 'dembel/build.gradle', 'dembel/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK with Gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
        working-directory: dembel

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dembel-apk
          path: dembel/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
