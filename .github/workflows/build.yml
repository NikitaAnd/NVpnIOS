name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle 8.4
        run: |
          set -e
          GRADLE_VERSION=8.4
          if [ ! -d "/opt/gradle/gradle-${GRADLE_VERSION}" ]; then
            sudo mkdir -p /opt/gradle
            cd /tmp
            wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O gradle.zip
            sudo unzip -q gradle.zip -d /opt/gradle
            rm gradle.zip
          fi
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH

      - name: Cache Gradle and AGP
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('dembel/build.gradle', 'dembel/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug
        working-directory: dembel

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dembel-apk
          path: dembel/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
