name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build APK
        run: gradle assembleDebug
        working-directory: dembel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dembel-apk
          path: dembel/app/build/outputs/apk/debug/*.apk
