name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Go to project directory
        run: cd .dembel

      - name: Build APK
        run: gradle assembleDebug
        working-directory: .dembel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dembel-apk
          path: .dembel/app/build/outputs/apk/debug/*.apk
